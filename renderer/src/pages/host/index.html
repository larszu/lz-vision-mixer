<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OGraf host</title>
<style>
  /* Public Sans for graphics that name it (e.g. lz-lyrics); shipped locally, no web font service. */
  @font-face { font-family: 'Public Sans'; font-style: normal; font-weight: 100 900; font-display: block;
    src: url(fonts/public-sans-latin-ext-wght-normal.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Public Sans'; font-style: normal; font-weight: 100 900; font-display: block;
    src: url(fonts/public-sans-latin-wght-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  @font-face { font-family: 'Public Sans'; font-style: italic; font-weight: 100 900; font-display: block;
    src: url(fonts/public-sans-latin-ext-wght-italic.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Public Sans'; font-style: italic; font-weight: 100 900; font-display: block;
    src: url(fonts/public-sans-latin-wght-italic.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* The graphic element sits unstyled in a full-frame container, as in the OGraf reference renderer. */
  #stage { position: fixed; inset: 0; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="host.js"></script>
</body>
</html>
